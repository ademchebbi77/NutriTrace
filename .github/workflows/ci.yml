# Continuous integration of NutriTrace: on every push and pull request to main,
# four independent jobs check the Laravel app and the local AI service.
#
# The app lives in the NutriTrace/ folder of this repository: every job runs from there.
# No database server and no AI service are needed: the Laravel tests use an in-memory
# SQLite database with AI_ENABLED=false (phpunit.xml), the Python tests a fake LLM.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # "Run workflow" button in the Actions tab.
  workflow_dispatch:

# A new push cancels the run still in progress for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  laravel-tests:
    name: Laravel tests (PHPUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NutriTrace
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, intl, bcmath, gd, fileinfo
          # PCOV measures which lines the tests run, for SonarCloud.
          coverage: pcov

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('NutriTrace/composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run the tests with coverage
        run: php artisan test --coverage-clover coverage/clover.xml

      - name: Keep the coverage report for SonarCloud
        uses: actions/upload-artifact@v4
        with:
          name: php-coverage
          path: NutriTrace/coverage/clover.xml
          retention-days: 7

  pint:
    name: Code style (Pint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NutriTrace
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('NutriTrace/composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check the code style
        run: vendor/bin/pint --test

  frontend:
    name: Front-end build (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NutriTrace
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: NutriTrace/package-lock.json

      # --ignore-scripts: the install scripts of the packages do not run (the build does not need them).
      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Build the assets
        run: npm run build

  python-tests:
    name: AI service tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NutriTrace/ai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: NutriTrace/ai/requirements-ci.txt

      # Not requirements.txt: it pulls PyTorch and CUDA (several GB), which the tests do not
      # need (they use a fake LLM). Training and the real LLM stay on the machine with the GPU.
      # Locked versions checked by their sha256, prebuilt wheels only: nothing else can be
      # installed and no package code runs during the installation.
      - name: Install Python dependencies
        run: |
          pip install --require-hashes --only-binary :all: -r requirements-ci.txt

      - name: Run the tests with coverage
        run: python -X utf8 -m pytest -q tests --cov=nutritrace_ai --cov=server --cov-report=xml:coverage.xml

      - name: Keep the coverage report for SonarCloud
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: NutriTrace/ai/coverage.xml
          retention-days: 7

  docker-build-scan-publish:
    name: Docker build, scan & publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata for tagging
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/nutritrace-app
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      # Build and push Laravel app image
      - name: Build and push Laravel app image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./NutriTrace
          file: ./NutriTrace/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      # Scan image with Trivy for vulnerabilities
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/nutritrace-app:${{ github.ref_name }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
        if: github.event_name != 'pull_request'

      # Upload Trivy results to GitHub Security tab
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        if: github.event_name != 'pull_request'

      # Generate Trivy report for artifacts
      - name: Run Trivy scanner for report
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/nutritrace-app:${{ github.ref_name }}
          format: 'json'
          output: 'trivy-report.json'
        if: github.event_name != 'pull_request'

      # Upload Trivy report as artifact
      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: trivy-report.json
          retention-days: 30
        if: github.event_name != 'pull_request'

      # Skip AI service build in CI - it's too large (3GB+ of CUDA dependencies)
      # AI Docker image should be built locally or in production with GPU access

  sonarcloud:
    name: Code quality (SonarCloud)
    runs-on: ubuntu-latest
    # Uses the coverage reports of both test jobs.
    needs: [laravel-tests, python-tests]
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: SonarCloud tells new code from old code with git blame.
          fetch-depth: 0

      - name: Get the PHP coverage report
        uses: actions/download-artifact@v4
        with:
          name: php-coverage
          path: NutriTrace/coverage

      - name: Get the Python coverage report
        uses: actions/download-artifact@v4
        with:
          name: python-coverage
          path: NutriTrace/ai

      # Settings in sonar-project.properties at the repository root.
      - name: Analyse with SonarCloud
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
