# Continuous Deployment (GitOps) to the Kubernetes cluster.
# When CI passes on main, it has published the image ghcr.io/<owner>/nutritrace-app:main-<sha>.
# This workflow writes that tag into k8s/overlays/minikube/kustomization.yaml and commits it;
# Argo CD, running inside the cluster, sees the commit and rolls the new version out.
# (GitHub cannot reach a cluster on a PC: the cluster pulls from git instead.)

name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [main]
  # Manual deployment trigger: deploys the image of the current main commit.
  workflow_dispatch:

# One deployment at a time, the newest wins.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

# Read-only by default; only the job that commits the new tag can write (SonarCloud githubactions:S8233).
permissions:
  contents: read

jobs:
  update-manifests:
    name: Deploy to Kubernetes (Argo CD)
    runs-on: ubuntu-latest
    # Only deploy if CI passed on a push to main (not for a pull request run).
    if: ${{ (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/nutritrace-app
      KUSTOMIZATION: k8s/overlays/minikube/kustomization.yaml
      # The commit CI tested (workflow_run) or the current main (manual run).
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    # No checkout: no code from the repository runs in this privileged job (SonarCloud
    # githubactions:S7631). The one-line change goes through the GitHub API.
    steps:
      - name: Compute the image tag
        id: tag
        run: echo "tag=main-${SHA::7}" >> "$GITHUB_OUTPUT"

      # Never point the cluster to an image that does not exist.
      - name: Check the image was published
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          repository="${IMAGE#ghcr.io/}"
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:${repository}:pull" | jq -r .token)
          curl -fsS -o /dev/null \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/${repository}/manifests/${TAG}"
          echo "$IMAGE:$TAG exists"

      # Reads the file on main, replaces the tag and writes it back as a commit by
      # github-actions[bot]. The write names the version it replaces (sha): if main changed
      # in between, GitHub refuses it and the step reads the file again.
      # [skip ci]: this commit only changes the deployed version. Commits made with
      # GITHUB_TOKEN do not start workflows anyway, so there is no loop.
      - name: Write the new tag in the Kubernetes manifests
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          for attempt in 1 2 3; do
            file=$(gh api "repos/$REPOSITORY/contents/$KUSTOMIZATION?ref=main")
            current=$(jq -r .content <<< "$file" | base64 -d)
            updated=$(sed -E "s|^(\s*newTag:).*|\1 ${TAG}|" <<< "$current")
            if [ "$updated" = "$current" ]; then
              echo "Already deployed: $TAG"
              exit 0
            fi
            if gh api -X PUT "repos/$REPOSITORY/contents/$KUSTOMIZATION" \
                 -f message="Deploy ${TAG} to Kubernetes [skip ci]" \
                 -f content="$(base64 -w0 <<< "$updated")" \
                 -f sha="$(jq -r .sha <<< "$file")" \
                 -f branch=main > /dev/null; then
              grep -n "newTag" <<< "$updated"
              exit 0
            fi
            echo "main changed meanwhile, retrying ($attempt)"
            sleep 3
          done
          exit 1

      - name: Deployment Summary
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          {
            echo "### 🚀 Deployment"
            echo ""
            echo "- **Image**: \`$IMAGE:$TAG\`"
            echo "- **Commit**: $SHA"
            echo "- **Target**: Kubernetes (Minikube), applied by Argo CD from \`k8s/overlays/minikube\`"
            echo "- **Triggered by**: ${{ github.actor }}"
          } >> "$GITHUB_STEP_SUMMARY"

  notify-deployment:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [update-manifests]
    if: always()

    steps:
      # Skipped (CI failed, nothing to deploy) is not an error: only a failed deployment is.
      - name: Deployment Status
        env:
          RESULT: ${{ needs.update-manifests.result }}
          TAG: ${{ needs.update-manifests.outputs.tag }}
        run: |
          case "$RESULT" in
            success) echo "✅ $TAG handed to Argo CD: it will be live in the cluster within ~3 minutes" ;;
            skipped) echo "⏭️ Deployment skipped: CI did not pass, nothing was deployed" ;;
            *)       echo "❌ Deployment failed ($RESULT)"; exit 1 ;;
          esac
