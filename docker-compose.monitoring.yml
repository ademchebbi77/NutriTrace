# Docker Compose extension for monitoring with Prometheus & Grafana
# Usage: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
# This extends the main docker-compose.yml with monitoring services

services:
  # Prometheus - metrics collection and alerting
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: nutritrace-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - nutritrace-network
    depends_on:
      - app

  # Grafana - metrics visualization and dashboards
  grafana:
    image: grafana/grafana:13.2.4
    container_name: nutritrace-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:${GRAFANA_PORT:-3000}
      - GF_INSTALL_PLUGINS=grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
    networks:
      - nutritrace-network
    depends_on:
      - prometheus

  # MySQL Exporter - export MySQL metrics to Prometheus
  # (since v0.15 the connection is given by flags and MYSQLD_EXPORTER_PASSWORD, not DATA_SOURCE_NAME)
  mysql-exporter:
    image: prom/mysqld-exporter:v0.20.0
    container_name: nutritrace-mysql-exporter
    restart: unless-stopped
    command:
      - '--mysqld.address=db:3306'
      - '--mysqld.username=root'
      - '--collect.info_schema.tables'
      - '--collect.info_schema.innodb_metrics'
      - '--collect.info_schema.processlist'
      - '--collect.perf_schema.tablelocks'
    environment:
      - MYSQLD_EXPORTER_PASSWORD=${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    networks:
      - nutritrace-network
    depends_on:
      db:
        condition: service_healthy

  # cAdvisor - container metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: nutritrace-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - nutritrace-network
    devices:
      - /dev/kmsg

  # Node Exporter - system/hardware metrics
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: nutritrace-node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - nutritrace-network

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
