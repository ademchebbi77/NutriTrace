# SonarQube Cloud analysis of NutriTrace, run by the "SonarCloud" job of .github/workflows/ci.yml.
# Dashboard: https://sonarcloud.io/project/overview?id=ademchebbi77_NutriTrace

sonar.organization=ademchebbi77
sonar.projectKey=ademchebbi77_NutriTrace
sonar.projectName=NutriTrace
sonar.sourceEncoding=UTF-8
# The CI job waits for the Quality Gate and fails with it (otherwise it stays green either way).
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Code of the project: the Laravel app and the local AI service.
sonar.sources=NutriTrace/app,NutriTrace/config,NutriTrace/database,NutriTrace/resources,NutriTrace/routes,NutriTrace/ai/nutritrace_ai,NutriTrace/ai/scripts,NutriTrace/ai/server.py,.github
sonar.tests=NutriTrace/tests,NutriTrace/ai/tests

# Third-party themes (Start Bootstrap, MIT licence) are not our code.
sonar.exclusions=**/vendor/**,**/node_modules/**,NutriTrace/resources/assets/css/admin/sb-admin-2.css,NutriTrace/resources/assets/css/public/landing-page.css,NutriTrace/resources/assets/img/**

# Coverage reports produced by the test jobs (PHPUnit with PCOV, pytest-cov).
sonar.php.coverage.reportPaths=NutriTrace/coverage/clover.xml
sonar.python.coverage.reportPaths=NutriTrace/ai/coverage.xml
sonar.python.version=3.11
# Only measured where tests can run: views, migrations, seeders and config are not unit-tested code.
sonar.coverage.exclusions=NutriTrace/resources/**,NutriTrace/database/**,NutriTrace/config/**,NutriTrace/routes/**,NutriTrace/ai/scripts/**,.github/**
# Seeders and demo data repeat the same structures on purpose.
sonar.cpd.exclusions=NutriTrace/database/seeders/**,NutriTrace/lang/**

# Pseudo-random generators (S2245): the training-data scripts use a seeded random.Random on
# purpose, so the same synthetic dataset comes out on every run. No security value is drawn.
sonar.issue.ignore.multicriteria=seededdata
sonar.issue.ignore.multicriteria.seededdata.ruleKey=python:S2245
sonar.issue.ignore.multicriteria.seededdata.resourceKey=NutriTrace/ai/scripts/**/*.py
