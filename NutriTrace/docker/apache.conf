# NutriTrace virtual host: Laravel's public/ folder on port 8080.
ServerName localhost
# The versions of Apache and the OS stay private.
ServerTokens Prod
ServerSignature Off

<VirtualHost *:8080>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        # Laravel's .htaccess sends every request to index.php.
        AllowOverride All
        Require all granted
        # No directory listing. FollowSymLinks: public/storage links to storage/app/public.
        Options -Indexes +FollowSymLinks
    </Directory>

    # The official image sends these files to the container output (docker logs).
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
