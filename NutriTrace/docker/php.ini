; NutriTrace settings, on top of php.ini-production.
; No "X-Powered-By: PHP/x.y.z" header.
expose_php = Off
memory_limit = 256M

; Certificates (PDF), logos and avatars are limited to 4 MB by the validation rules.
upload_max_filesize = 8M
post_max_size = 10M

; The code never changes inside a container: OPcache does not check the files again.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
