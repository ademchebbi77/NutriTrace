# Prometheus alerting rules for NutriTrace
groups:
  - name: nutritrace_alerts
    interval: 30s
    rules:
      # Application is down
      - alert: NutriTraceDown
        expr: up{job="nutritrace-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "NutriTrace application is down"
          description: "The NutriTrace application has been unreachable for more than 1 minute."

      # Database connection issues
      - alert: DatabaseConnectionFailed
        expr: nutritrace_database_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Database connection failed"
          description: "NutriTrace cannot connect to the database."

      # Cache connection issues
      - alert: CacheConnectionFailed
        expr: nutritrace_cache_up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Cache connection failed"
          description: "NutriTrace cannot connect to the cache system."

      # High memory usage
      - alert: HighMemoryUsage
        expr: nutritrace_memory_bytes > 536870912 # 512MB
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage detected"
          description: "Application memory usage is above 512MB for 5 minutes."

      # MySQL is down
      - alert: MySQLDown
        expr: up{job="mysql"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MySQL database is down"
          description: "The MySQL database has been unreachable for more than 1 minute."

      # Container CPU usage high
      - alert: HighCPUUsage
        expr: rate(container_cpu_usage_seconds_total{name="nutritrace-app"}[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage in NutriTrace container"
          description: "Container CPU usage is above 80% for 5 minutes."

      # Container memory usage high
      - alert: HighContainerMemory
        expr: container_memory_usage_bytes{name="nutritrace-app"} / container_spec_memory_limit_bytes{name="nutritrace-app"} > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage in NutriTrace container"
          description: "Container memory usage is above 90% for 5 minutes."

      # Disk space warning
      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space"
          description: "Available disk space is below 10%."
